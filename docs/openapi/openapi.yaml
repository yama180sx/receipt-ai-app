openapi: 3.0.3
info:
  title: Receipt AI App API
  description: |
    OpenAPI 正本（全公開 API）。
    Phase 1: auth / receipt / stats — Phase 2 (#98-8-10): category / admin / upload / health。
    詳細な as-built 仕様は docs/design/api-spec.md を参照。
  version: 1.1.0

servers:
  - url: /api
    description: Express app（baseURL = EXPO_PUBLIC_API_URL、通常 `/api` 付き）
  - url: /
    description: ルート（/health のみ。/api プレフィックスなし）

tags:
  - name: auth
  - name: receipt
  - name: stats
  - name: category
  - name: admin
  - name: upload
  - name: health

paths:
  /product-types:
    get:
      tags: [product-classification]
      summary: 有効な商品種別一覧取得
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductTypeSummary'

  /product-classification/review-items:
    get:
      tags: [product-classification]
      summary: 要確認・未分類の商品明細一覧取得
      description: 世帯内の needs_review、unclassified、outside_initial_scope の商品明細を取得する。商品種別対象外の not_applicable（対象外カテゴリおよび承認済みの値引き・アプリ適用行）は含めない。
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: カンマ区切りの分類状態。省略時は要確認対象の全状態。
          schema:
            type: string
            example: needs_review,unclassified,outside_initial_scope
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: month
          in: query
          description: 対象月（YYYY-MM）
          schema:
            type: string
            pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductClassificationReviewItem'

  /product-classification/learning-data:
    get:
      tags: [product-classification]
      summary: 世帯の商品分類学習データ一覧取得
      description: 世帯辞書・確定履歴を取得する。標準ルールは返却せず、確定履歴は参照専用である。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductClassificationLearningData'

  /product-classification/learning-data/{type}/{id}/deactivate:
    patch:
      tags: [product-classification]
      summary: 世帯の商品分類学習データを無効化
      description: 世帯辞書のみ無効化できる。確定履歴と標準ルールは変更できない。
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [household_dictionary]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateProductClassificationLearningDataRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductClassificationLearningData'

  /admin/product-classification/reclassification-runs:
    post:
      tags: [product-classification]
      summary: 世帯内の既存明細を再分類（管理者）
      description: |
        指定世帯の未分類・要確認明細を再評価する。承認済みの負額の値引き・アプリ適用行は、辞書・類似候補より先に商品種別対象外へ更新する。
        手動確定済み明細は対象外で、実行条件と変更内容は監査ログに保存する。管理者権限と二要素認証が必要。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductClassificationReclassificationRunRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductClassificationReclassificationRun'

  /admin/product-classification/standard-rules:
    get:
      tags: [product-classification]
      summary: 標準分類ルール一覧取得（管理者）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StandardProductClassificationRule' }
    post:
      tags: [product-classification]
      summary: 標準分類ルール追加（管理者）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertStandardProductClassificationRuleRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/StandardProductClassificationRule' } }

  /admin/product-classification/standard-rules/preview:
    post:
      tags: [product-classification]
      summary: 標準分類ルールの自世帯内プレビュー（管理者）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewStandardProductClassificationRuleRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/StandardProductClassificationRulePreview' } }

  /admin/product-classification/standard-rules/{id}:
    patch:
      tags: [product-classification]
      summary: 標準分類ルール更新（管理者）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertStandardProductClassificationRuleRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/StandardProductClassificationRule' } }

  /admin/product-classification/standard-rules/{id}/deactivate:
    patch:
      tags: [product-classification]
      summary: 標準分類ルール無効化（管理者）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeactivateProductClassificationLearningDataRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/StandardProductClassificationRule' } }

  /auth/resolve-family:
    post:
      tags: [auth]
      summary: 招待コードから世帯を解決
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveFamilyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResolvedFamily'

  /auth/families/{familyGroupId}/members:
    get:
      tags: [auth]
      summary: ログイン前メンバー一覧
      parameters:
        - name: familyGroupId
          in: path
          required: true
          schema:
            type: integer
        - name: inviteCode
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuthFamilyMember'

  /auth/login:
    post:
      tags: [auth]
      summary: パスワード認証
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'

  /auth/totp/setup:
    post:
      tags: [auth]
      summary: TOTP シークレット発行
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TotpSetupInfo'

  /auth/totp/confirm:
    post:
      tags: [auth]
      summary: TOTP 有効化
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'

  /auth/verify-totp:
    post:
      tags: [auth]
      summary: ログイン時 TOTP 検証
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'

  /auth/totp/disable:
    post:
      tags: [auth]
      summary: TOTP 無効化
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpDisableRequest'
      responses:
        '200':
          description: OK

  /receipts:
    get:
      tags: [receipt]
      summary: レシート一覧
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: memberId
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: 店舗名または明細名の類似検索語
          schema:
            type: string
        - name: limit
          in: query
          description: 取得件数（省略時20、1〜50）
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: 次ページ取得用の署名付き不透明カーソル
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptListPage'
    post:
      tags: [receipt]
      summary: 手動レシート登録
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualReceiptRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptDetail'

  /receipts/latest:
    get:
      tags: [receipt]
      summary: 最新レシート 1 件
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/ReceiptDetail'
                          - type: 'null'

  /receipts/{id}:
    get:
      tags: [receipt]
      summary: レシート詳細 1 件
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptDetail'
    patch:
      tags: [receipt]
      summary: レシート全体編集
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReceiptRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptDetail'
    delete:
      tags: [receipt]
      summary: レシート削除
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageEnvelope'

  /receipts/commit:
    post:
      tags: [receipt]
      summary: AI 解析結果の確定保存
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitReceiptRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptDetail'
        '409':
          description: 重複レシート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateReceiptError'

  /receipts/upload:
    post:
      tags: [receipt]
      summary: 画像アップロード → 解析ジョブ投入
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, memberId]
              properties:
                image:
                  type: string
                  format: binary
                memberId:
                  type: integer
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadJobResponse'
        '503':
          description: キューストア移行中のため新規解析投入を停止中

  /receipts/jobs:
    get:
      tags: [receipt]
      summary: 解析ジョブ一覧
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReceiptJobListItem'

  /receipts/jobs/{jobId}:
    delete:
      tags: [receipt]
      summary: 未取り込みジョブ破棄
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageEnvelope'

  /receipts/jobs/{jobId}/retry:
    post:
      tags: [receipt]
      summary: 失敗した解析ジョブを同じ画像で再実行
      description: 本人の失敗ジョブだけを対象に、元画像が残っている場合に同じjobIdで解析ジョブを再投入する。日次クォータ超過時の自動再試行は行わない。
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadJobResponse'
        '404':
          description: Not Found
        '409':
          description: 再実行できないジョブ状態または元画像なし
        '503':
          description: キューストア移行中のため手動再実行を停止中

  /receipts/status/{jobId}:
    get:
      tags: [receipt]
      summary: 解析ジョブ状態
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptJobStatus'

  /receipts/items/{itemId}:
    patch:
      tags: [receipt]
      summary: 明細カテゴリ更新
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemCategoryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptItemDetail'

  /receipts/items/{itemId}/product-classification:
    patch:
      tags: [receipt]
      summary: 明細商品種別修正
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemProductClassificationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReceiptItemDetail'

  /receipts/items/{itemId}/product-classification-candidates:
    get:
      tags: [receipt]
      summary: 明細の商品分類候補取得
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductClassificationCandidateSummary'
        '404':
          description: Not Found

  /receipts/items/{itemId}/splits:
    post:
      tags: [receipt]
      summary: 明細按分保存
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveItemSplitsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: array
                            items:
                              $ref: '#/components/schemas/ItemSplitSummary'
                          - type: object
                            properties:
                              message:
                                type: string

  /family-groups/members:
    get:
      tags: [receipt]
      summary: 認証済み世帯メンバー一覧
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FamilyMemberSummary'

  /stats/monthly:
    get:
      tags: [stats]
      summary: 月別家計統計
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MonthlyStatsData'

  /stats/advanced:
    get:
      tags: [stats]
      summary: トレンド・パレート分析
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdvancedStatsData'

  /stats/product-classification:
    get:
      tags: [stats]
      summary: 商品分類統計
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductClassificationStatsData'

  /stats/settlement:
    get:
      tags: [stats]
      summary: 月間精算ステータス
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SettlementStatusData'

  /stats/settlement/transfers:
    post:
      tags: [stats]
      summary: 送金履歴追加
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettlementTransferRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SettlementTransfer'

  /stats/settlement/transfers/{id}:
    delete:
      tags: [stats]
      summary: 送金履歴削除
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer

  /categories:
    get:
      tags: [category]
      summary: カテゴリ一覧
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
  /uploads/{filename}:
    get:
      tags: [upload]
      summary: レシート画像配信（認証付き）
      security:
        - bearerAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 画像バイナリ
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Not Found

  /admin/stats:
    get:
      tags: [admin]
      summary: AI コスト統計
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminCostStatRow'

  /admin/ai-budget:
    get:
      tags: [admin]
      summary: 全体 AI 予算の設定・利用状況を取得
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GlobalAiBudgetOverview'
        '403':
          description: 全体AI予算管理者ではない
    put:
      tags: [admin]
      summary: 全体 AI 予算を更新
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlobalAiBudgetRequest'
      responses:
        '200':
          description: OK
        '400':
          description: 入力不正
        '403':
          description: 全体AI予算管理者ではない

  /admin/ai-budget/resume:
    post:
      tags: [admin]
      summary: 停止した全体 AI 予算を理由付きで再開
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalAiBudgetReasonRequest'
      responses:
        '200': { description: OK }
        '400': { description: 入力不正 }
        '403': { description: 全体AI予算管理者ではない }

  /admin/ai-budget/managers:
    get:
      tags: [admin]
      summary: 全体 AI 予算管理者一覧
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: 全体AI予算管理者ではない }
    post:
      tags: [admin]
      summary: 全体 AI 予算管理者を追加
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalAiBudgetManagerRequest'
      responses:
        '200': { description: OK }
        '400': { description: 入力不正 }
        '409': { description: 重複 }

  /admin/ai-budget/managers/{memberId}:
    delete:
      tags: [admin]
      summary: 全体 AI 予算管理者を削除
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalAiBudgetReasonRequest'
      responses:
        '200': { description: OK }
        '409': { description: 最後の管理者は削除不可 }
  /admin/prompts:
    get:
      tags: [admin]
      summary: プロンプトテンプレート一覧
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PromptTemplate'
    post:
      tags: [admin]
      summary: プロンプト新規作成
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromptTemplateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PromptTemplate'

  /admin/prompts/{id}:
    patch:
      tags: [admin]
      summary: プロンプト更新
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePromptTemplateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PromptTemplate'
    delete:
      tags: [admin]
      summary: プロンプト削除
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageEnvelope'

  /admin/prompts/{id}/activate:
    patch:
      tags: [admin]
      summary: デフォルトプロンプト切替
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessageEnvelope'

  /health:
    get:
      tags: [health]
      summary: 死活監視
      servers:
        - url: /
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiSuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data: {}

    ApiMessageEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string

    ResolveFamilyRequest:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:
          type: string

    ResolvedFamily:
      type: object
      required: [familyGroupId, name]
      properties:
        familyGroupId:
          type: integer
        name:
          type: string

    AuthFamilyMember:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    LoginRequest:
      type: object
      required: [familyGroupId, memberId, password]
      properties:
        familyGroupId:
          type: integer
        memberId:
          type: integer
        password:
          type: string

    LoginMember:
      type: object
      required: [id, name, familyGroupId, role]
      properties:
        id:
          type: integer
        name:
          type: string
        familyGroupId:
          type: integer
        role:
          type: string
        totpEnabled:
          type: boolean

    LoginResponse:
      type: object
      required: [token, pendingToken, member, requiresTotpVerification, requiresTotpSetup]
      properties:
        token:
          type: string
          nullable: true
        pendingToken:
          type: string
          nullable: true
        member:
          $ref: '#/components/schemas/LoginMember'
        requiresTotpVerification:
          type: boolean
        requiresTotpSetup:
          type: boolean

    TotpSetupInfo:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret:
          type: string
        otpauthUrl:
          type: string

    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    TotpDisableRequest:
      type: object
      required: [password, code]
      properties:
        password:
          type: string
        code:
          type: string

    CategorySummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
          nullable: true

    ProductTypeSummary:
      type: object
      required: [id, code, name, standardCategoryId]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        standardCategoryId:
          type: integer

    ProductTypeStatus:
      type: string
      description: classified は商品種別確定、needs_review と unclassified は商品分類対象、outside_initial_scope は初期種別範囲外、not_applicable は商品種別対象外（対象外カテゴリまたは承認済みの値引き・アプリ適用行）。
      enum: [classified, needs_review, unclassified, outside_initial_scope, not_applicable]

    ClassificationSource:
      type: string
      enum: [history, household_dictionary, standard_dictionary, similarity, ai, manual]

    ClassificationCorrectionScope:
      type: string
      enum: [item_only, same_ocr_name]

    ProductClassificationCandidateSource:
      type: string
      enum: [history, household_dictionary, standard_dictionary]

    ProductClassificationCandidateSummary:
      type: object
      required: [productType, source, matchedNormalizedName, similarity, rank]
      properties:
        productType:
          $ref: '#/components/schemas/ProductTypeSummary'
        source:
          $ref: '#/components/schemas/ProductClassificationCandidateSource'
        matchedNormalizedName:
          type: string
        similarity:
          type: number
          format: float
        rank:
          type: integer

    ProductClassificationReviewItem:
      type: object
      required: [item, receiptId, receiptDate, storeName]
      properties:
        item:
          $ref: '#/components/schemas/ReceiptItemDetail'
        receiptId:
          type: integer
        receiptDate:
          type: string
          format: date-time
          nullable: true
        storeName:
          type: string

    ProductClassificationLearningDataType:
      type: string
      enum: [household_dictionary, history]

    ProductClassificationLearningData:
      type: object
      required: [id, type, normalizedName, productType, isActive, createdAt, updatedAt, lastDeactivationAudit]
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/ProductClassificationLearningDataType'
        normalizedName:
          type: string
        productType:
          $ref: '#/components/schemas/ProductTypeSummary'
        isActive:
          type: boolean
          nullable: true
          description: 確定履歴は参照専用のため null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastDeactivationAudit:
          allOf:
            - $ref: '#/components/schemas/ProductClassificationLearningDataAudit'
          nullable: true

    ProductClassificationLearningDataAudit:
      type: object
      required: [reason, actorMemberName, familyGroupName, createdAt]
      properties:
        reason:
          type: string
        actorMemberName:
          type: string
          nullable: true
        familyGroupName:
          type: string
        createdAt:
          type: string
          format: date-time

    DeactivateProductClassificationLearningDataRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    UpsertStandardProductClassificationRuleRequest:
      type: object
      required: [keyword, productTypeId, priority, reason]
      properties:
        keyword: { type: string, minLength: 1, maxLength: 100 }
        productTypeId: { type: integer, minimum: 1 }
        priority: { type: integer, minimum: 0, maximum: 100000 }
        reason: { type: string, minLength: 1, maxLength: 500 }

    PreviewStandardProductClassificationRuleRequest:
      type: object
      required: [keyword]
      properties:
        keyword: { type: string, minLength: 1, maxLength: 100 }

    StandardProductClassificationRule:
      type: object
      required: [id, keyword, productType, priority, isActive, createdByMemberName, updatedByMemberName, lastChangeReason, createdAt, updatedAt]
      properties:
        id: { type: integer }
        keyword: { type: string }
        productType: { $ref: '#/components/schemas/ProductTypeSummary' }
        priority: { type: integer }
        isActive: { type: boolean }
        createdByMemberName: { type: string, nullable: true }
        updatedByMemberName: { type: string, nullable: true }
        lastChangeReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StandardProductClassificationRulePreviewItem:
      type: object
      required: [id, name, normalizedName]
      properties:
        id: { type: integer }
        name: { type: string }
        normalizedName: { type: string }

    StandardProductClassificationRulePreview:
      type: object
      required: [normalizedKeyword, matchedCount, items]
      properties:
        normalizedKeyword: { type: string }
        matchedCount: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/StandardProductClassificationRulePreviewItem' }

    ProductClassificationReclassificationRunStatus:
      type: string
      enum: [completed, partial_failure]

    ProductClassificationReclassificationItemOutcome:
      type: string
      enum: [updated, unchanged, failed]

    CreateProductClassificationReclassificationRunRequest:
      type: object
      properties:
        statuses:
          type: array
          description: 対象にする未確定状態。省略時は unclassified と needs_review。
          minItems: 1
          items:
            type: string
            enum: [unclassified, needs_review]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        limit:
          type: integer
          minimum: 1
          maximum: 500

    ProductClassificationReclassificationItemAudit:
      type: object
      required: [itemId, outcome, previousProductTypeStatus, nextProductTypeStatus, previousClassificationSource, nextClassificationSource, createdAt]
      properties:
        itemId:
          type: integer
        outcome:
          $ref: '#/components/schemas/ProductClassificationReclassificationItemOutcome'
        previousProductTypeStatus:
          $ref: '#/components/schemas/ProductTypeStatus'
        nextProductTypeStatus:
          $ref: '#/components/schemas/ProductTypeStatus'
        previousProductTypeId:
          type: integer
          nullable: true
        nextProductTypeId:
          type: integer
          nullable: true
        previousClassificationSource:
          allOf:
            - $ref: '#/components/schemas/ClassificationSource'
          nullable: true
        nextClassificationSource:
          allOf:
            - $ref: '#/components/schemas/ClassificationSource'
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ProductClassificationReclassificationRun:
      type: object
      required: [id, statuses, limit, selectedCount, updatedCount, unchangedCount, failedCount, status, createdAt, completedAt, itemAudits]
      properties:
        id:
          type: integer
        statuses:
          type: array
          items:
            type: string
            enum: [unclassified, needs_review]
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        limit:
          type: integer
        selectedCount:
          type: integer
        updatedCount:
          type: integer
        unchangedCount:
          type: integer
        failedCount:
          type: integer
        status:
          $ref: '#/components/schemas/ProductClassificationReclassificationRunStatus'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        itemAudits:
          type: array
          items:
            $ref: '#/components/schemas/ProductClassificationReclassificationItemAudit'

    ClassificationConfidence:
      type: string
      enum: [high, medium, low]

    ItemSplitSummary:
      type: object
      required: [id, itemId, familyMemberId, amount]
      properties:
        id:
          type: integer
        itemId:
          type: integer
        familyMemberId:
          type: integer
        amount:
          type: number

    ReceiptItemDetail:
      type: object
      required:
        [id, name, price, quantity, categoryId, standardCategoryId, productTypeId, productType,
         productTypeStatus, classificationSource, classificationConfidence]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
        quantity:
          type: number
        categoryId:
          type: integer
          nullable: true
        category:
          oneOf:
            - $ref: '#/components/schemas/CategorySummary'
            - type: 'null'
        standardCategoryId:
          type: integer
          nullable: true
        productTypeId:
          type: integer
          nullable: true
        productType:
          oneOf:
            - $ref: '#/components/schemas/ProductTypeSummary'
            - type: 'null'
        productTypeStatus:
          $ref: '#/components/schemas/ProductTypeStatus'
        classificationSource:
          oneOf:
            - $ref: '#/components/schemas/ClassificationSource'
            - type: 'null'
        classificationConfidence:
          oneOf:
            - $ref: '#/components/schemas/ClassificationConfidence'
            - type: 'null'
        splits:
          type: array
          items:
            $ref: '#/components/schemas/ItemSplitSummary'

    ReceiptDetail:
      type: object
      required: [id, storeName, totalAmount, items]
      properties:
        id:
          type: integer
        storeName:
          type: string
        date:
          type: string
          format: date-time
        totalAmount:
          type: number
        taxAmount:
          type: number
        imagePath:
          type: string
          nullable: true
        memberId:
          type: integer
        familyGroupId:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItemDetail'

    ReceiptListPage:
      type: object
      required: [items, nextCursor, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptDetail'
        nextCursor:
          type: string
          nullable: true
        hasNext:
          type: boolean

    ManualReceiptRequest:
      type: object
      required: [date, storeName, items]
      properties:
        date:
          type: string
        storeName:
          type: string
        imagePath:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItemInput'

    UpdateReceiptRequest:
      type: object
      properties:
        date:
          type: string
        storeName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItemInput'

    ReceiptItemInput:
      type: object
      required: [name, price, quantity]
      properties:
        name:
          type: string
        price:
          type: number
        quantity:
          type: number
        categoryId:
          type: integer
          nullable: true

    CommitReceiptRequest:
      type: object
      required: [parsedData, imagePath, validation]
      properties:
        jobId:
          type: string
        parsedData:
          $ref: '#/components/schemas/ParsedReceiptCommitData'
        imagePath:
          type: string
        validation:
          $ref: '#/components/schemas/ReceiptValidation'

    ParsedReceiptCommitData:
      type: object
      required: [storeName, totalAmount, items]
      properties:
        storeName:
          type: string
        purchaseDate:
          type: string
        date:
          type: string
        totalAmount:
          type: number
        taxAmount:
          type: number
        usageLogId:
          oneOf:
            - type: integer
            - type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ParsedReceiptItem'

    ParsedReceiptItem:
      type: object
      required: [name, price, quantity]
      properties:
        name:
          type: string
        price:
          type: number
        quantity:
          type: number
        categoryId:
          type: integer
          nullable: true

    ReceiptValidation:
      type: object
      required: [isSuspicious, warnings]
      properties:
        isSuspicious:
          type: boolean
        warnings:
          type: array
          items:
            type: string

    DuplicateReceiptError:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
          enum: [DUPLICATE]
        existingId:
          type: integer

    UploadJobResponse:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
        status:
          type: string

    ReceiptJobListItem:
      type: object
      required: [id, state, imagePath, createdAt]
      properties:
        id:
          type: string
        state:
          type: string
        imagePath:
          type: string
          nullable: true
        createdAt:
          type: number
        failedReason:
          type: string
          nullable: true
        retry:
          type: object
          description: 失敗ジョブの手動再実行可否。サーバー側ポリシーで判定する。
          properties:
            eligible:
              type: boolean
            remainingCount:
              type: integer
              minimum: 0
            availableAt:
              type: number
              format: double
