services:
  # --- Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ENV_NAME はアプリの dev/stable 機能モード。ホストごとのDocker実体名はINSTANCE_NAMEで分離する。
    container_name: receipt-${INSTANCE_NAME:-${ENV_NAME}}-backend
    restart: unless-stopped
    user: "${UID}:${GID}"
    command: ${BACKEND_COMMAND}
    volumes:
      - ./backend:/app
      - /etc/localtime:/etc/localtime:ro
      - ./backend/uploads:/app/uploads
    stdin_open: true
    tty: true
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=${NODE_ENV}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Frontend (Web/Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
      args:
        # Web 本番は Nginx /api プロキシ経由（同一 Origin）。Expo Go は frontend/.env の絶対 URL を使用
        - EXPO_PUBLIC_API_URL=/api
        - EXPO_PUBLIC_APP_ENV=${ENV_NAME}
    container_name: receipt-${INSTANCE_NAME:-${ENV_NAME}}-frontend
    ports:
      - "${WEB_PORT}:80"
    restart: unless-stopped
    environment:
      - TZ=Asia/Tokyo
    depends_on:
      - backend

  # --- Frontend (Expo Dev Server) ---
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: receipt-${INSTANCE_NAME:-${ENV_NAME}}-frontend-dev
    restart: unless-stopped
    user: "${UID}:${GID}"
    command: sh /app/scripts/expo-dev-server.sh
    volumes:
      - ./frontend:/app
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${DEV_PORT}:${DEV_PORT}"
      - "${EXPO_PORT_1:-19000}:19000"
      - "${EXPO_PORT_2:-19001}:19001"
    stdin_open: true
    tty: true
    env_file:
      - ./frontend/.env
    environment:
      - TZ=Asia/Tokyo
      - ENV_NAME=${ENV_NAME}
      - HOST_IP=${HOST_IP}
      - DEV_PORT=${DEV_PORT}
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP}
      - EXPO_PACKAGER_PROXY_URL=http://${HOST_IP}:${DEV_PORT}
    depends_on:
      - backend

  # --- Database ---
  db:
    image: postgres:18
    container_name: receipt-${INSTANCE_NAME:-${ENV_NAME}}-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_statement=none
      - -c
      - log_duration=off
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Queue store (Valkey) ---
  # service名は既存BullMQ接続（REDIS_HOST=redis）との互換のため維持する。
  redis:
    image: valkey/valkey:8.1.10-alpine3.24@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    container_name: receipt-${INSTANCE_NAME:-${ENV_NAME}}-redis
    restart: unless-stopped
    environment:
      - TZ=Asia/Tokyo
    volumes:
      # Redis CE 7.4 の既存RDBはValkeyと互換ではないため、旧redisdataをmountしない。
      - "${RECAIPT_QUEUE_DATA_DIR:-./valkeydata}:/data"
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
