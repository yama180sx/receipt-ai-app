name: T320 CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, linux, t320]

    steps:
      # root所有の信頼済み作業領域、credential配布、Compose操作はunit内部で固定する。
      # runnerはアプリ秘密値・Docker socket・任意引数を受け取らない。
      - name: Request fixed stable deployment unit
        run: sudo -n /usr/bin/systemctl start receipt-deploy-stable.service
