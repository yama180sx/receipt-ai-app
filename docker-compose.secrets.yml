# Issue #131-3-1: root管理unitがRECAIPT_SECRETS_DIRを用意した時だけ、base composeへ重ねる。
# このファイル単体では既存環境へ秘密値を生成・複写しない。
services:
  backend:
    environment:
      DATABASE_URL_FILE: /run/secrets/backend_database_url
      JWT_SECRET_FILE: /run/secrets/backend_jwt_secret
      GEMINI_API_KEY_FILE: /run/secrets/backend_gemini_api_key
      AI_BUDGET_DISCORD_WEBHOOK_URL_FILE: /run/secrets/backend_ai_budget_discord_webhook
      SMTP_USER_FILE: /run/secrets/backend_smtp_user
      SMTP_PASSWORD_FILE: /run/secrets/backend_smtp_password
      SMTP_FROM_FILE: /run/secrets/backend_smtp_from
    secrets:
      - backend_database_url
      - backend_jwt_secret
      - backend_gemini_api_key
      - backend_ai_budget_discord_webhook
      - backend_smtp_user
      - backend_smtp_password
      - backend_smtp_from

  db:
    # 基底Composeの直接値と併用しない。PostgreSQLの_FILE契約は両方があると起動を拒否する。
    environment: !override
      - TZ=Asia/Tokyo
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password

secrets:
  backend_database_url:
    file: ${RECAIPT_SECRETS_DIR:?RECAIPT_SECRETS_DIR is required}/backend_database_url
  backend_jwt_secret:
    file: ${RECAIPT_SECRETS_DIR:?RECAIPT_SECRETS_DIR is required}/backend_jwt_secret
  backend_gemini_api_key:
    file: ${RECAIPT_SECRETS_DIR:?RECAIPT_SECRETS_DIR is required}/backend_gemini_api_key
  backend_ai_budget_discord_webhook:
    file: ${RECAIPT_SECRETS_DIR:?RECAIPT_SECRETS_DIR is required}/backend_ai_budget_discord_webhook
  backend_smtp_user:
    file: ${RECAIPT_SECRETS_DIR:?RECAIPT_SECRETS_DIR is required}/backend_smtp_user
  backend_smtp_password:
    file: ${RECAIPT_SECRETS_DIR:?RECAIPT_SECRETS_DIR is required}/backend_smtp_password
  backend_smtp_from:
    file: ${RECAIPT_SECRETS_DIR:?RECAIPT_SECRETS_DIR is required}/backend_smtp_from
  postgres_password:
    file: ${RECAIPT_SECRETS_DIR:?RECAIPT_SECRETS_DIR is required}/postgres_password
